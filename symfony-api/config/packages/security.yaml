security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_USER]
        ROLE_ADMIN: ROLE_USER
    providers:
        app_users:
            id: App\Infrastructure\Security\DbalUserProvider
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            json_login:
                check_path: api.v1.auth.login
                username_path: email
                password_path: password
                success_handler: App\Infrastructure\Security\LoginSuccessHandler
                failure_handler: App\Infrastructure\Security\LoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: api.v1.auth.logout
            remember_me:
                secret: '%kernel.secret%'
                name: storefront_remember
                remember_me_parameter: remember_me
                lifetime: 2592000
                path: /
                secure: '%env(bool:SESSION_COOKIE_SECURE)%'
                httponly: true
                samesite: lax

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
