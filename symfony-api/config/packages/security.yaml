security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    role_hierarchy:
        ROLE_SUPERADMIN: [ROLE_ADMIN, ROLE_USER]
        ROLE_ADMIN: ROLE_USER
    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|app)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            jwt: ~
    access_control:
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/profile, roles: ROLE_USER }
        - { path: ^/api/me, roles: ROLE_USER }
        - { path: ^/api, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
