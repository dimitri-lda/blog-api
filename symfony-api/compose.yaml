services:
    php:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - path: '.env.example'
            - path: '.env'
              required: false
            - path: '.env.local'
              required: false
        volumes:
            - '.:/srv/app'
            - '/srv/app/vendor'
            - '/srv/app/var'
        environment:
            APP_ENV: '${APP_ENV:-dev}'
            DEFAULT_URI: 'http://localhost:${APP_PORT:-8080}'
            DATABASE_URL: 'postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@pgsql:5432/${POSTGRES_DB:-app}'
            REDIS_URL: 'redis://redis:6379'
            LOCK_DSN: 'redis://redis:6379'
            MESSENGER_TRANSPORT_DSN: 'redis://redis:6379/messages'
            MESSENGER_FAILED_TRANSPORT_DSN: 'redis://redis:6379/messages_failed'
        networks:
            - symfony-api
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    caddy:
        image: 'caddy:2.10-alpine'
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - './docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro'
            - './public:/srv/app/public:ro'
            - './frontend/dist:/srv/frontend/dist:ro'
            - 'caddy-data:/data'
            - 'caddy-config:/config'
        networks:
            - symfony-api
        depends_on:
            - php

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${POSTGRES_PASSWORD:-app}'
            POSTGRES_DB: '${POSTGRES_DB:-app}'
            POSTGRES_USER: '${POSTGRES_USER:-app}'
            POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-app}'
        volumes:
            - 'pgsql-data:/var/lib/postgresql'
        networks:
            - symfony-api
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${POSTGRES_DB:-app}'
                - '-U'
                - '${POSTGRES_USER:-app}'
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:8-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        networks:
            - symfony-api
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

networks:
    symfony-api:
        driver: bridge

volumes:
    pgsql-data:
        name: '${POSTGRES_VOLUME_NAME:-blog-api_sail-pgsql}'
        driver: local
    redis-data:
        name: '${REDIS_VOLUME_NAME:-blog-api_sail-redis}'
        driver: local
    caddy-data:
        driver: local
    caddy-config:
        driver: local
