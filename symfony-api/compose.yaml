name: sportivo-symfony

services:
  php:
    build:
      context: .
      target: dev
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/tmp/composer
    environment: &app-env
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-change-this-development-secret}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sportivo}:${POSTGRES_PASSWORD:-sportivo}@postgres:5432/${POSTGRES_DB:-sportivo}?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      MAILER_DSN: smtp://mailpit:1025
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      target: dev
    working_dir: /app
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
    restart: unless-stopped
    volumes:
      - .:/app
    environment: *app-env
    depends_on:
      php: { condition: service_healthy }

  node:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - node-modules:/app/frontend/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${VITE_PORT:-5174}:5174"

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app/frontend
    command: sh -c "npm install && npm run test:e2e"
    volumes:
      - .:/app
      - playwright-node-modules:/app/frontend/node_modules
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      E2E_BASE_URL: http://caddy
      CI: "true"
    depends_on:
      caddy: { condition: service_started }
    profiles: ["test"]

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/app:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      php: { condition: service_healthy }
      node: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportivo}
      POSTGRES_USER: ${POSTGRES_USER:-sportivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportivo}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportivo} -d ${POSTGRES_DB:-sportivo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8026}:8025"

volumes:
  postgres-data:
  redis-data:
  node-modules:
  playwright-node-modules:
  composer-cache:
  caddy-data:
