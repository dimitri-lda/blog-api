  products:
    cloudswift-4:
      name: { en: "Cloudswift 4", ru: "Cloudswift 4", pl: "Cloudswift 4" }
      description:
        en: "A responsive everyday runner with soft landings and confident grip."
        ru: "Отзывчивые кроссовки на каждый день с мягким приземлением и надёжным сцеплением."
        pl: "Responsywne buty do codziennego biegania, z miękkim lądowaniem i pewną przyczepnością."
    move-training-mat:
      name: { en: "Move Training Mat", ru: "Коврик для тренировок Move", pl: "Mata treningowa Move" }
      description:
        en: "A grippy, comfortable mat for your home and studio practice."
        ru: "Нескользящий удобный коврик для тренировок дома и в студии."
        pl: "Antypoślizgowa, wygodna mata do ćwiczeń w domu i studio."
    pure-aero-98:
      name: { en: "Pure Aero 98", ru: "Pure Aero 98", pl: "Pure Aero 98" }
      description:
        en: "Spin, precision and feel for the player who controls every point."
        ru: "Вращение, точность и контроль для игрока, который управляет каждым розыгрышем."
        pl: "Rotacja, precyzja i czucie dla gracza kontrolującego każdą piłkę."
    trail-shell-jacket:
      name: { en: "Trail Shell Jacket", ru: "Штормовая куртка для трейла", pl: "Kurtka membranowa na trail" }
      description:
        en: "Lightweight weather protection built for changing mountain days."
        ru: "Лёгкая защита от непогоды для переменчивых горных дней."
        pl: "Lekka ochrona przed pogodą na zmienne górskie dni."
    aero-run-shorts:
      name: { en: "Aero Run Shorts", ru: "Беговые шорты Aero", pl: "Spodenki biegowe Aero" }
      description:
        en: "Light, breathable shorts that stay out of your way."
        ru: "Лёгкие дышащие шорты, которые не сковывают движения."
        pl: "Lekkie, oddychające spodenki, które nie krępują ruchów."
    kettlebell-12kg:
      name: { en: "Kettlebell 12kg", ru: "Гиря 12 кг", pl: "Kettlebell 12 kg" }
      description:
        en: "A durable cast iron kettlebell for full-body strength sessions."
        ru: "Прочная чугунная гиря для силовых тренировок всего тела."
        pl: "Wytrzymały żeliwny kettlebell do treningu siłowego całego ciała."
    court-backpack:
      name: { en: "Court Backpack", ru: "Теннисный рюкзак", pl: "Plecak tenisowy" }
      description:
        en: "Smart storage for your racket, kit and everyday essentials."
        ru: "Продуманное место для ракетки, экипировки и повседневных вещей."
        pl: "Przemyślana przestrzeń na rakietę, sprzęt i codzienne rzeczy."
    alpine-daypack:
      name: { en: "Alpine Daypack 24L", ru: "Альпийский рюкзак 24 л", pl: "Plecak alpejski 24 l" }
      description:
        en: "A comfortable, versatile daypack for every trail."
        ru: "Удобный универсальный рюкзак для любого маршрута."
        pl: "Wygodny, wszechstronny plecak na każdy szlak."
